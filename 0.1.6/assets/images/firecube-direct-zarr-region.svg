<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">DirectZarrIngestor write-intent flow</title>
  <desc id="desc">A plugin converts a source batch into region, one-dimensional, timestamp, or static write intents that Firecube applies to a plugin-declared Zarr schema.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3b4652"/>
    </marker>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#1f2933}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#3b4652}
      .hint{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#5a6673}
      .box{fill:#f7fbff;stroke:#4f8bd6;stroke-width:2}
      .intent{fill:#fff4ed;stroke:#ff7043;stroke-width:2}
      .zarr{fill:#eef8f2;stroke:#2f9d65;stroke-width:2}
      .cell{fill:#ffffff;stroke:#b9d7c6;stroke-width:1}
      .write{fill:#ffcc80;stroke:#d27a00;stroke-width:2}
      .line{stroke:#3b4652;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="42" y="92" width="190" height="144" rx="10" class="box"/>
  <text x="137" y="132" text-anchor="middle" class="label">Source batch</text>
  <text x="137" y="162" text-anchor="middle" class="small">product values</text>
  <text x="137" y="187" text-anchor="middle" class="small">product metadata</text>

  <path class="line" d="M232 164 H312"/>
  <rect x="312" y="82" width="232" height="164" rx="10" class="intent"/>
  <text x="428" y="122" text-anchor="middle" class="label">Write intents</text>
  <text x="428" y="152" text-anchor="middle" class="small">region</text>
  <text x="428" y="176" text-anchor="middle" class="small">1-D or timestamp</text>
  <text x="428" y="200" text-anchor="middle" class="small">static</text>

  <path class="line" d="M544 164 H616"/>
  <rect x="616" y="42" width="292" height="258" rx="10" class="zarr"/>
  <text x="762" y="78" text-anchor="middle" class="label">Zarr arrays</text>
  <g transform="translate(668 108)">
    <rect x="0" y="0" width="40" height="36" class="cell"/>
    <rect x="40" y="0" width="40" height="36" class="cell"/>
    <rect x="80" y="0" width="40" height="36" class="cell"/>
    <rect x="120" y="0" width="40" height="36" class="cell"/>
    <rect x="160" y="0" width="40" height="36" class="cell"/>
    <rect x="0" y="36" width="40" height="36" class="cell"/>
    <rect x="40" y="36" width="40" height="36" class="cell"/>
    <rect x="80" y="36" width="40" height="36" class="write"/>
    <rect x="120" y="36" width="40" height="36" class="write"/>
    <rect x="160" y="36" width="40" height="36" class="cell"/>
    <rect x="0" y="72" width="40" height="36" class="cell"/>
    <rect x="40" y="72" width="40" height="36" class="cell"/>
    <rect x="80" y="72" width="40" height="36" class="write"/>
    <rect x="120" y="72" width="40" height="36" class="write"/>
    <rect x="160" y="72" width="40" height="36" class="cell"/>
    <rect x="0" y="108" width="40" height="36" class="cell"/>
    <rect x="40" y="108" width="40" height="36" class="cell"/>
    <rect x="80" y="108" width="40" height="36" class="cell"/>
    <rect x="120" y="108" width="40" height="36" class="cell"/>
    <rect x="160" y="108" width="40" height="36" class="cell"/>
    <text x="100" y="176" text-anchor="middle" class="hint">declared by zarr_schema()</text>
  </g>
</svg>
