site_name: Firecube
site_description: A plugin-based batch ingestion CLI for turning Earth Observation products into analysis-ready datacubes.
not_in_nav: |
  concepts/plugins/index.md
  quickstart/catalogs.md
  quickstart/configuration.md
  tutorials/weather-csv.md
site_url: https://eumetsat.github.io/firecube/
repo_url: https://github.com/eumetsat/firecube
repo_name: eumetsat/firecube
extra:
  version:
    provider: mike
    default: latest
theme:
  name: material
  logo: assets/firecube-amblem-white.png
  favicon: assets/firecube-favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - mkdocs-click
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.inlinehilite
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mermaid2:
      arguments:
        theme: neutral
        flowchart:
          curve: linear
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
         # Objects inventories for the third-party types that appear in public                                                                                                                                                                                                                                                                                                                                
         # signatures, so annotations link to their own documentation.                                                                                                                                                                                                                                                                                                                                        
         # Fetched at build time; see docs job in .github/workflows/ci.yml. 
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.xarray.dev/en/stable/objects.inv
          options:
            docstring_style: google
            show_source: false
            show_category_heading: true
            show_root_heading: true
            members_order: source
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            signature_crossrefs: true
  - macros:
      module_name: docs/_macros

