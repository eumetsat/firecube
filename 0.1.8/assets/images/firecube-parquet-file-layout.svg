<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Firecube Parquet output layout</title>
  <desc id="desc">Firecube writes one Parquet file per group and batch; each file contains row groups, column chunks, and footer metadata.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3b4652"/>
    </marker>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#1f2933}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#3b4652}
      .hint{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#5a6673}
      .source{fill:#f7fbff;stroke:#4f8bd6;stroke-width:2}
      .engine{fill:#fff4ed;stroke:#ff7043;stroke-width:2}
      .parquet{fill:#f3f1ff;stroke:#6f62d2;stroke-width:2}
      .rowgroup{fill:#ffffff;stroke:#6f62d2;stroke-width:1.6}
      .column{fill:#eeeaff;stroke:#6f62d2;stroke-width:1.3}
      .footer{fill:#fff8df;stroke:#d6a400;stroke-width:1.6}
      .line{stroke:#3b4652;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="34" y="60" width="180" height="222" rx="10" class="source"/>
  <text x="124" y="96" text-anchor="middle" class="label">Source batches</text>
  <rect x="62" y="126" width="124" height="34" rx="4" fill="#ffffff" stroke="#4f8bd6"/>
  <rect x="62" y="178" width="124" height="34" rx="4" fill="#ffffff" stroke="#4f8bd6"/>
  <rect x="62" y="230" width="124" height="34" rx="4" fill="#ffffff" stroke="#4f8bd6"/>
  <text x="124" y="148" text-anchor="middle" class="small">batch 0</text>
  <text x="124" y="200" text-anchor="middle" class="small">batch 1</text>
  <text x="124" y="252" text-anchor="middle" class="small">batch 2</text>

  <path class="line" d="M214 171 H300"/>
  <rect x="300" y="88" width="206" height="166" rx="10" class="engine"/>
  <text x="403" y="122" text-anchor="middle" class="label">Parquet plugin</text>
  <text x="403" y="150" text-anchor="middle" class="small">GenericParquetIngestor</text>
  <text x="403" y="176" text-anchor="middle" class="small">build_dataset</text>
  <text x="403" y="202" text-anchor="middle" class="small">returns table or dataframe</text>
  <text x="403" y="226" text-anchor="middle" class="small">one file per group/batch</text>

  <path class="line" d="M506 171 H586"/>
  <rect x="586" y="42" width="326" height="288" rx="12" class="parquet"/>
  <text x="749" y="80" text-anchor="middle" class="label">group/part-0001.parquet</text>
  <text x="749" y="106" text-anchor="middle" class="small">independent output file</text>

  <rect x="628" y="132" width="242" height="70" rx="6" class="rowgroup"/>
  <text x="749" y="156" text-anchor="middle" class="small">row group 0</text>
  <rect x="646" y="170" width="58" height="18" rx="3" class="column"/>
  <rect x="714" y="170" width="58" height="18" rx="3" class="column"/>
  <rect x="782" y="170" width="58" height="18" rx="3" class="column"/>

  <rect x="628" y="214" width="242" height="70" rx="6" class="rowgroup"/>
  <text x="749" y="238" text-anchor="middle" class="small">row group 1</text>
  <rect x="646" y="252" width="58" height="18" rx="3" class="column"/>
  <rect x="714" y="252" width="58" height="18" rx="3" class="column"/>
  <rect x="782" y="252" width="58" height="18" rx="3" class="column"/>

  <rect x="628" y="296" width="242" height="34" rx="6" class="footer"/>
  <text x="749" y="318" text-anchor="middle" class="small">footer metadata</text>

  <text x="704" y="356" text-anchor="middle" class="hint">column chunks keep tabular records efficient to scan and filter</text>
</svg>
