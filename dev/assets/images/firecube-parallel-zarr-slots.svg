<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Parallel Zarr slot workers</title>
  <desc id="desc">Three workers write disjoint indexed ranges into one Zarr group.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3b4652"/>
    </marker>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#1f2933}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#3b4652}
      .hint{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#5a6673}
      .worker{fill:#f7fbff;stroke:#4f8bd6;stroke-width:2}
      .slotA{fill:#dbeafe;stroke:#4f8bd6;stroke-width:2}
      .slotB{fill:#dcfce7;stroke:#2f9d65;stroke-width:2}
      .slotC{fill:#ffedd5;stroke:#ff7043;stroke-width:2}
      .store{fill:#fbfbfd;stroke:#6b7280;stroke-width:2}
      .line{stroke:#3b4652;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .boundary{stroke:#6b7280;stroke-width:2;stroke-dasharray:6 4}
    </style>
  </defs>
  <text x="42" y="40" class="label">Worker processes</text>
  <rect x="54" y="70" width="160" height="48" rx="8" class="worker"/>
  <rect x="54" y="150" width="160" height="48" rx="8" class="worker"/>
  <rect x="54" y="230" width="160" height="48" rx="8" class="worker"/>
  <text x="134" y="100" text-anchor="middle" class="small">worker 0</text>
  <text x="134" y="180" text-anchor="middle" class="small">worker 1</text>
  <text x="134" y="260" text-anchor="middle" class="small">worker 2</text>

  <text x="410" y="40" text-anchor="middle" class="label">Assigned slot ranges</text>
  <rect x="300" y="70" width="220" height="48" rx="8" class="slotA"/>
  <rect x="300" y="150" width="220" height="48" rx="8" class="slotB"/>
  <rect x="300" y="230" width="220" height="48" rx="8" class="slotC"/>
  <text x="410" y="100" text-anchor="middle" class="small">[0, 144)</text>
  <text x="410" y="180" text-anchor="middle" class="small">[144, 288)</text>
  <text x="410" y="260" text-anchor="middle" class="small">[288, 432)</text>
  <path class="line" d="M214 94 H292"/>
  <path class="line" d="M214 174 H292"/>
  <path class="line" d="M214 254 H292"/>

  <path class="line" d="M520 94 H608"/>
  <path class="line" d="M520 174 H608"/>
  <path class="line" d="M520 254 H608"/>
  <rect x="608" y="72" width="300" height="206" rx="10" class="store"/>
  <text x="758" y="106" text-anchor="middle" class="label">One Zarr group</text>
  <g transform="translate(640 145)">
    <rect x="0" y="0" width="70" height="54" class="slotA"/>
    <rect x="70" y="0" width="70" height="54" class="slotB"/>
    <rect x="140" y="0" width="70" height="54" class="slotC"/>
    <rect x="210" y="0" width="34" height="54" fill="#ffffff" stroke="#b9c0ca" stroke-width="2"/>
    <line x1="70" y1="-18" x2="70" y2="75" class="boundary"/>
    <line x1="140" y1="-18" x2="140" y2="75" class="boundary"/>
    <text x="35" y="86" text-anchor="middle" class="hint">0-143</text>
    <text x="105" y="86" text-anchor="middle" class="hint">144-287</text>
    <text x="175" y="86" text-anchor="middle" class="hint">288-431</text>
  </g>
  <text x="758" y="258" text-anchor="middle" class="hint">boundaries align to Zarr chunks</text>
</svg>
