[project]
name = "firecube"
version = "0.1.4.post1"
description = "A plugin-based batch ingestion CLI for turning Earth Observation products into analysis-ready datacubes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Armagan Karatosun", email = "armagan.karatosun@eumetsat.int" },
    { name = "Anna-Lena Erdmann", email = "anna-lena.erdmann@eumetsat.int" },
    { name = "Carlos Horn", email = "carlos.horn@eumetsat.int" },
]
dependencies = [
    "duckdb>=1.4.1",
    "pandas>=2.3.3",
    "numpy>=2.3.3",
    "pyarrow>=16.1.0",
    "xarray>=2025.10.1",
    "zarr>=3.1.3",
    "psutil>=7.1.0",
    "fsspec>=2025.9.0",
    "s3fs>=2025.9.0",
    "botocore[crt]>=1.42.19",
    "netcdf4>=1.7.1.post2",
    "h5netcdf>=1.4.2",
    "h5py>=3.11.0",
    "dask[array]>=2025.1.0",
    "prometheus-client>=0.23.1",
    "opentelemetry-sdk>=1.37.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "click>=8.2.1",
]

[project.optional-dependencies]
obstore = ["obstore>=0.4.0"]
tensogram = ["tensogram>=0.22.0,<0.23", "tensogram-xarray>=0.22.0,<0.23", "tensogram-zarr>=0.22.0,<0.23"]
healpix = ["healpix-geo>=0.2.1"]
virtualzarr = ["virtualizarr>=2.7.0,<3"]
test = [
    "tensogram>=0.22.0,<0.23",
    "tensogram-xarray>=0.22.0,<0.23",
    "tensogram-zarr>=0.22.0,<0.23",
    "obstore>=0.4.0",
    "healpix-geo>=0.2.1",
    "moto[s3,server]>=5.0.0",
    # Static docstring inspection for the public-API docs coverage contract
    # (tests/sdk/test_api_docs_coverage.py). Also ships with the docs group.
    "griffelib>=2.0",
]

[project.urls]
Homepage = "https://eumetsat.github.io/firecube/"
"Bug Tracker" = "https://github.com/eumetsat/firecube/issues"
Documentation = "https://github.com/eumetsat/firecube/blob/main/README.md"
"Source Code" = "https://github.com/eumetsat/firecube"
Organization = "https://www.eumetsat.int/"
"Release Notes" = "https://github.com/eumetsat/firecube/blob/main/CHANGELOG.md"

[project.scripts]
firecube = "firecube.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.2.0",
    "pyright>=1.1.410",
]
docs = [
    "mkdocs>=1.5.3,<2.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0",
    "mkdocstrings-python>=2.0",
    "mkdocs-mermaid2-plugin>=0.6.0",
    "mkdocs-click>=0.9.0",
    "mkdocs-macros-plugin>=1.0,<2.0",
    "mike>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/firecube"]
artifacts = [
    "src/firecube/ingestor/devtools/_templates/*.tpl",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/W: Standard flake8 rules
# I: Isort (imports)
# B: Bugbear (common bugs)
# UP: Pyupgrade (modernize syntax)
# C4: Comprehensions (better list/dict comps)
# SIM: Simplify (code simplification)
# PERF: Performance anti-patterns
# RUF: Ruff specific rules
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "PERF", "RUF"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "E203",    # Whitespace before ':' (conflicts with formatter)
    "SIM108",  # Use ternary operator (can reduce readability)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers -m 'not race'"
testpaths = [
    "tests",
]
markers = [
    "unit: proper unit tests",
    "integration: end-to-end integration tests",
    "architecture: repository architecture and boundary invariant tests",
    "contract: public SDK, plugin, CLI, and persisted-format contract tests",
    "docs_static: documentation, help-text, and static prose drift checks",
    "snapshot: deliberately approved narrow golden snapshot tests",
    "slow: slow running tests",
    "plugin: plugin tests",
    "s3: s3 tests",
    "concurrency: concurrency tests",
    "race: multi-process race regression on legacy per-slot chunks; RED by design; excluded from default lane; run explicitly via -m race",
    "gate: promoted regression gates that must stay GREEN under the shipped mechanism",
    "benchmark: peak-retained-payload regression-smoke harness (Linux + /usr/bin/time -v; skips gracefully otherwise)",
    "benchmark_evidence: long-form high-fidelity benchmark evidence (manual; not part of default CI lane)",
]

[tool.bandit]
# B608: hardcoded SQL via f-string. SQL identifiers (table/column names) cannot
# be parameterized; we substitute them via the validated `_quote_ident()` helper
# in `ingestor/utils/duckdb_utils.py` or from a module constant in `scripts/`.
# Both patterns are safe by construction.
skips = ["B608"]
