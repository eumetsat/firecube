name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra test --group dev
      - name: Install test fixture plugins
        run: |
          uv pip install -e tests/fixtures/firecube_test_plugins
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --strict-deps -m "not slow and not s3 and not race" -n auto --cov=firecube -q

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: quality-gate
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12

      - name: Verify release tag matches pyproject version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match pyproject version v$version" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
