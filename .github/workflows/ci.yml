name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra test --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra test --group dev
      - name: Install test fixture plugins
        run: |
          uv pip install -e tests/fixtures/cli_test_plugin
          uv pip install -e tests/fixtures/direct_zarr_capable_test_plugin
          uv pip install -e tests/fixtures/direct_zarr_non_capable_test_plugin
          uv pip install -e tests/fixtures/multi_group_capable_test_plugin
          uv pip install -e tests/fixtures/cf_time_dim_test_plugin
          uv pip install -e tests/fixtures/slot_shape_test_plugin
          uv pip install -e tests/fixtures/index_spec_test_plugin
          uv pip install -e tests/fixtures/index_spec_integer_test_plugin
          uv pip install -e tests/fixtures/callable_payload_test_plugin
          uv pip install -e tests/fixtures/irregular_axis_test_plugin
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra test --group dev
      - name: Install test fixture plugins
        run: |
          uv pip install -e tests/fixtures/cli_test_plugin
          uv pip install -e tests/fixtures/direct_zarr_capable_test_plugin
          uv pip install -e tests/fixtures/direct_zarr_non_capable_test_plugin
          uv pip install -e tests/fixtures/multi_group_capable_test_plugin
          uv pip install -e tests/fixtures/cf_time_dim_test_plugin
          uv pip install -e tests/fixtures/slot_shape_test_plugin
          uv pip install -e tests/fixtures/index_spec_test_plugin
          uv pip install -e tests/fixtures/index_spec_integer_test_plugin
          uv pip install -e tests/fixtures/callable_payload_test_plugin
          uv pip install -e tests/fixtures/irregular_axis_test_plugin
      - run: uv run pytest --strict-deps -m "not slow and not s3 and not docs_static and not snapshot" -n auto --cov=firecube --cov-report=term-missing -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra test --group docs
      - run: uv run mkdocs build --strict --site-dir /tmp/firecube-mkdocs-check
      - name: Install test fixture plugins
        run: |
          uv pip install -e tests/fixtures/cli_test_plugin
          uv pip install -e tests/fixtures/direct_zarr_capable_test_plugin
          uv pip install -e tests/fixtures/direct_zarr_non_capable_test_plugin
          uv pip install -e tests/fixtures/multi_group_capable_test_plugin
          uv pip install -e tests/fixtures/cf_time_dim_test_plugin
          uv pip install -e tests/fixtures/slot_shape_test_plugin
          uv pip install -e tests/fixtures/index_spec_test_plugin
          uv pip install -e tests/fixtures/index_spec_integer_test_plugin
          uv pip install -e tests/fixtures/callable_payload_test_plugin
          uv pip install -e tests/fixtures/irregular_axis_test_plugin
      - name: Documentation and help-text drift checks
        run: uv run pytest --strict-deps -m "docs_static or snapshot" -q --tb=short

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,license
          exit-code: '1'
          severity: CRITICAL,HIGH,MEDIUM,LOW

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, SSPL-1.0
